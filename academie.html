<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSPD — Académie</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div class="app-shell">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="topbar">
  <div class="tb-left">
    <button class="tb-menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="tb-brand"><div class="tb-shield"></div><img class="tb-logo" src="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png" alt="LSPD" onerror="this.style.display='none'"><div class="tb-title">L.S.P.D</div></div>
    <div class="tb-page">Académie</div>
  </div>
  <div class="tb-right">
    <div class="tb-status"><div class="live-dot"></div>En ligne</div>
    <div class="tb-time" id="tbClock">--:--:--</div>
    <div class="tb-user"><span class="tb-grade" id="tbGrade">—</span><span class="tb-name" id="tbName">Officier</span></div>
    <button class="btn-out" onclick="logout()">Quitter</button>
  </div>
</div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="page-head">
      <div class="page-head-left"><h2>Académie de Police</h2><p>// Formation & suivi des cadets — Los Santos Police Department</p></div>
      <button class="btn btn-primary" id="btnNew">+ Nouvelle formation</button>
    </div>
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-box blue"><div class="stat-lbl">FORMATIONS</div><div class="stat-val" id="sTotal">—</div></div>
      <div class="stat-box green"><div class="stat-lbl">EN COURS</div><div class="stat-val" id="sEnCours">—</div></div>
      <div class="stat-box gold"><div class="stat-lbl">TERMINÉES</div><div class="stat-val" id="sTerminees">—</div></div>
      <div class="stat-box blue"><div class="stat-lbl">CADETS INSCRITS</div><div class="stat-val" id="sCadets">—</div></div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher par titre, instructeur..." oninput="filterItems()">
      <select id="filterStatut" onchange="filterItems()">
        <option value="">Tous les statuts</option>
        <option value="En cours">En cours</option>
        <option value="Terminée">Terminée</option>
        <option value="Planifiée">Planifiée</option>
      </select>
    </div>
    <div id="itemGrid" style="display:flex;flex-direction:column;gap:10px"></div>
    <div id="itemEmpty" style="display:none" class="empty-state"><div class="ei">🎓</div><p>Aucune formation enregistrée</p></div>
  </div>
</div>
</div>

<div class="modal-bg" id="modalForm">
  <div class="modal" style="max-width:580px">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">NOUVELLE FORMATION</div>
      <button class="modal-close" onclick="closeModal('modalForm')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid g2" style="margin-bottom:12px">
        <div class="fg" style="grid-column:1/-1"><label>Titre de la formation *</label><input id="fTitre" placeholder="ex: Formation tir, Cours de procédure..."></div>
        <div class="fg"><label>Instructeur</label><input id="fInstructeur" placeholder="Nom de l'instructeur"></div>
        <div class="fg"><label>Date</label><input type="date" id="fDate"></div>
        <div class="fg"><label>Durée</label><input id="fDuree" placeholder="ex: 2h, 1 journée..."></div>
        <div class="fg"><label>Statut</label>
          <select id="fStatut">
            <option value="Planifiée">Planifiée</option>
            <option value="En cours">En cours</option>
            <option value="Terminée">Terminée</option>
          </select>
        </div>
      </div>
      <div class="fg" style="margin-bottom:12px"><label>Cadets inscrits</label><input id="fCadets" placeholder="ex: Dupont, Martin, Leclerc..."></div>
      <div class="fg"><label>Description / Contenu</label><textarea id="fDescription" placeholder="Programme de la formation, objectifs..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button id="btnDelete" style="display:none;margin-right:auto" class="btn btn-danger btn-sm" onclick="deleteItem()">🗑 Supprimer</button>
      <button class="btn btn-ghost" onclick="closeModal('modalForm')">Annuler</button>
      <button class="btn btn-primary" onclick="saveItem()">Enregistrer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initPage, startClock, showToast, openModal, closeModal, setupModalClose, addLog } from './utils2.js';

  const FC = { apiKey:"AIzaSyA4GxYd32GNs5EDjjm2UI1a0d25YxigMVU",authDomain:"lspd-intranet-2aed9.firebaseapp.com",projectId:"lspd-intranet-2aed9",storageBucket:"lspd-intranet-2aed9.firebasestorage.app",messagingSenderId:"780922925382",appId:"1:780922925382:web:a32d5e89bcff75bd8b3547" };
  const app = initializeApp(FC); const auth = getAuth(app); const db = getFirestore(app);
  let allItems = [], editingId = null, userPerms = {}, userName = '';

  startClock('tbClock'); setupModalClose();
  window.closeModal = closeModal; window.openModal = openModal;

  initPage(auth, db, onAuthStateChanged, 'academie').then(async ({ grade, name, perms }) => {
    userPerms = perms; userName = name;
    if (perms.canWrite) {
      document.getElementById('btnNew').addEventListener('click', () => { editingId = null; resetForm(); document.getElementById('modalTitle').textContent = 'NOUVELLE FORMATION'; document.getElementById('btnDelete').style.display = 'none'; document.getElementById('fDate').value = new Date().toISOString().split('T')[0]; openModal('modalForm'); });
    } else { document.getElementById('btnNew').style.display = 'none'; }
    await load();
  });

  async function load() {
    try {
      const snap = await getDocs(collection(db, 'academie-formations'));
      allItems = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
      document.getElementById('sTotal').textContent    = allItems.length;
      document.getElementById('sEnCours').textContent  = allItems.filter(i => i.statut === 'En cours').length;
      document.getElementById('sTerminees').textContent= allItems.filter(i => i.statut === 'Terminée').length;
      const cadets = allItems.reduce((acc, i) => acc + (i.cadets ? i.cadets.split(',').filter(Boolean).length : 0), 0);
      document.getElementById('sCadets').textContent   = cadets;
      render(allItems);
    } catch(e) { console.error(e); }
  }

  const STATUT_COLORS = { 'En cours':'var(--success)', 'Terminée':'var(--accent-b)', 'Planifiée':'var(--gold)' };

  function render(list) {
    const grid = document.getElementById('itemGrid'); const empty = document.getElementById('itemEmpty');
    if (!list.length) { grid.innerHTML = ''; empty.style.display = 'flex'; return; }
    empty.style.display = 'none';
    grid.innerHTML = list.map(f => `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;align-items:flex-start;gap:16px;transition:all .15s" onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
            <span style="font-size:14px;font-weight:700;color:var(--text)">${f.titre||'—'}</span>
            <span style="font-family:JetBrains Mono,monospace;font-size:9px;padding:2px 8px;border-radius:3px;border:1px solid;color:${STATUT_COLORS[f.statut]||'var(--text2)'};border-color:${STATUT_COLORS[f.statut]||'var(--text2)'}22;background:${STATUT_COLORS[f.statut]||'var(--text2)'}15">${f.statut||'—'}</span>
          </div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px">
            ${f.instructeur ? `<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:var(--text2)">👮 ${f.instructeur}</div>` : ''}
            ${f.date ? `<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:var(--text2)">📅 ${new Date(f.date).toLocaleDateString('fr-FR')}</div>` : ''}
            ${f.duree ? `<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:var(--text2)">⏱ ${f.duree}</div>` : ''}
          </div>
          ${f.cadets ? `<div style="font-size:11px;color:var(--text2);margin-bottom:6px">Cadets : <span style="color:var(--text)">${f.cadets}</span></div>` : ''}
          ${f.description ? `<div style="font-size:12px;color:var(--text2);padding:8px 10px;background:var(--surface2);border-radius:4px;line-height:1.6">${f.description}</div>` : ''}
        </div>
        ${userPerms.canWrite ? `<button onclick="editItem('${f.id}')" style="padding:6px 12px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:4px;color:var(--gold);font-size:11px;cursor:pointer;flex-shrink:0">✏️ Modifier</button>` : ''}
      </div>`).join('');
  }

  window.filterItems = function() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const s = document.getElementById('filterStatut').value;
    render(allItems.filter(i => (i.titre+' '+i.instructeur+' '+i.cadets).toLowerCase().includes(q) && (!s || i.statut === s)));
  };

  window.editItem = function(id) {
    const f = allItems.find(x => x.id === id); if (!f) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'MODIFIER LA FORMATION';
    document.getElementById('btnDelete').style.display = userPerms.canDelete ? 'inline-flex' : 'none';
    document.getElementById('fTitre').value       = f.titre       || '';
    document.getElementById('fInstructeur').value = f.instructeur || '';
    document.getElementById('fDate').value        = f.date        || '';
    document.getElementById('fDuree').value       = f.duree       || '';
    document.getElementById('fStatut').value      = f.statut      || 'Planifiée';
    document.getElementById('fCadets').value      = f.cadets      || '';
    document.getElementById('fDescription').value = f.description || '';
    openModal('modalForm');
  };

  window.saveItem = async function() {
    const titre = document.getElementById('fTitre').value.trim();
    if (!titre) { showToast('Le titre est obligatoire', 'error'); return; }
    const payload = { titre, instructeur: document.getElementById('fInstructeur').value.trim(), date: document.getElementById('fDate').value, duree: document.getElementById('fDuree').value.trim(), statut: document.getElementById('fStatut').value, cadets: document.getElementById('fCadets').value.trim(), description: document.getElementById('fDescription').value.trim(), updatedAt: new Date().toISOString() };
    try {
      if (editingId) { await updateDoc(doc(db,'academie-formations',editingId), payload); showToast('Formation mise à jour ✓','success'); }
      else { payload.createdAt = new Date().toISOString(); await addDoc(collection(db,'academie-formations'), payload); showToast('Formation enregistrée ✓','success'); }
      closeModal('modalForm'); editingId = null; await load();
    } catch(e) { showToast('Erreur : '+e.message,'error'); }
  };

  window.deleteItem = async function() {
    if (!editingId || !confirm('Supprimer cette formation ?')) return;
    await deleteDoc(doc(db,'academie-formations',editingId));
    showToast('Formation supprimée','success'); closeModal('modalForm'); editingId = null; await load();
  };

  function resetForm() { ['fTitre','fInstructeur','fDate','fDuree','fCadets','fDescription'].forEach(id => document.getElementById(id).value = ''); document.getElementById('fStatut').value = 'Planifiée'; }
</script>
</body>
</html>
