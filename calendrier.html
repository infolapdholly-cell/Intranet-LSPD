<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSPD — Calendrier</title>
  <link rel="stylesheet" href="style.css?v=15">
  <style>
    .cal-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .cal-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .cal-iframe {
      width: 100%;
      height: calc(100vh - 200px);
      min-height: 500px;
      border: none;
      display: block;
    }
    .cal-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 200px);
      min-height: 500px;
      gap: 16px;
      color: var(--text2);
    }
    .cal-placeholder .icon { font-size: 48px; opacity: .3; }
    .cal-placeholder p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
    }
    .cal-placeholder code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      background: rgba(201,168,76,.08);
      border: 1px solid rgba(201,168,76,.2);
      border-radius: 4px;
      padding: 4px 10px;
    }
  </style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05080f">
</head>
<body>
<div class="app-shell">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="topbar">
  <div class="tb-left">
    <button class="tb-menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="tb-brand">
      <div class="tb-shield"></div>
      <img class="tb-logo" src="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png" alt="LSPD" onerror="this.style.display='none'">
      <div class="tb-title">L.S.P.D</div>
    </div>
    <div class="tb-page">Calendrier</div>
  </div>
  <div class="tb-right">
    <div class="tb-status"><div class="live-dot"></div>En ligne</div>
    <div class="tb-time" id="tbClock">--:--:--</div>
    <div class="tb-user">
      <span class="tb-grade" id="tbGrade">—</span>
      <span class="tb-name" id="tbName">Officier</span>
    </div>
    <button class="btn-out" onclick="logout()">Quitter</button>
  </div>
</div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">

    <div class="page-head">
      <div class="page-head-left">
        <h2>Calendrier</h2>
        <p>// Planning & événements — Los Santos Police Department</p>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="openNewEvent()" style="padding:8px 16px;background:var(--gold);color:#0a0c12;border:none;border-radius:5px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px">
          + Ajouter un événement
        </button>
        <button onclick="refreshCalendar()" style="padding:8px 12px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-size:14px;cursor:pointer" title="Actualiser">⟳</button>
      </div>
    </div>

    <!-- MODAL NOUVEL ÉVÉNEMENT -->
    <div id="modalEvent" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(2px)">
      <div style="background:var(--surface);border:1px solid var(--border2);border-radius:10px;width:100%;max-width:480px;position:relative;overflow:hidden">
        <div style="height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)"></div>
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase">📅 Nouvel événement</span>
          <button onclick="closeEventModal()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer">×</button>
        </div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gold);opacity:.7;letter-spacing:2px;text-transform:uppercase">Titre de l'événement *</label>
            <input id="evTitle" placeholder="ex: Patrouille, Briefing, Formation..." style="padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div style="display:flex;flex-direction:column;gap:5px">
              <label style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase">Date de début *</label>
              <input type="datetime-local" id="evStart" style="padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;width:100%">
            </div>
            <div style="display:flex;flex-direction:column;gap:5px">
              <label style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase">Date de fin</label>
              <input type="datetime-local" id="evEnd" style="padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;width:100%">
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase">Description (optionnel)</label>
            <textarea id="evDesc" placeholder="Détails de l'événement..." style="padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%;min-height:70px;resize:vertical"></textarea>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase">Lieu (optionnel)</label>
            <input id="evLocation" placeholder="ex: Bureau du LSPD, Mission Row..." style="padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%">
          </div>
          <div style="padding:10px;background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.15);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);line-height:1.6">
            ℹ L'événement s'ouvrira dans Google Calendar pour confirmation. Tu dois être connecté avec le compte Google qui possède ce calendrier.
          </div>
        </div>
        <div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px">
          <button onclick="closeEventModal()" style="padding:8px 16px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;cursor:pointer">Annuler</button>
          <button onclick="submitEvent()" style="padding:8px 16px;background:var(--gold);color:#0a0c12;border:none;border-radius:5px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer">Ouvrir dans Google Calendar</button>
        </div>
      </div>
    </div>

    <div class="cal-container">

      <div id="calContent"></div>
    </div>

  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initPage, startClock } from './utils2.js';

  const FC = {
    apiKey:"AIzaSyA4GxYd32GNs5EDjjm2UI1a0d25YxigMVU",
    authDomain:"lspd-intranet-2aed9.firebaseapp.com",
    projectId:"lspd-intranet-2aed9",
    storageBucket:"lspd-intranet-2aed9.firebasestorage.app",
    messagingSenderId:"780922925382",
    appId:"1:780922925382:web:a32d5e89bcff75bd8b3547"
  };

  const app  = initializeApp(FC);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  startClock('tbClock');

  initPage(auth, db, onAuthStateChanged, 'calendrier').then(function() {

    // Afficher le calendrier
    const container = document.getElementById('calContent');
    const iframe    = document.createElement('iframe');
    iframe.src      = 'https://calendar.google.com/calendar/embed?src=5103785f8ca3e1bd3c52b6e5b670d717168900206840a0f51645678157f1ab58%40group.calendar.google.com&ctz=America%2FToronto&bgcolor=%23050810&color=%23C9A84C&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0&hl=fr';
    iframe.className = 'cal-iframe';
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('scrolling', 'no');
    container.innerHTML = '';
    container.appendChild(iframe);

    // ── Fonctions événements ─────────────────────────────
    window.openNewEvent = function() {
      var now = new Date();
      now.setHours(now.getHours() + 1, 0, 0, 0);
      var end = new Date(now);
      end.setHours(end.getHours() + 1);
      var fmt = function(d) { return d.toISOString().slice(0,16); };
      document.getElementById('evStart').value    = fmt(now);
      document.getElementById('evEnd').value      = fmt(end);
      document.getElementById('evTitle').value    = '';
      document.getElementById('evDesc').value     = '';
      document.getElementById('evLocation').value = '';
      document.getElementById('evTitle').style.borderColor = '';
      document.getElementById('evStart').style.borderColor = '';
      document.getElementById('modalEvent').style.display = 'flex';
      setTimeout(function(){ document.getElementById('evTitle').focus(); }, 100);
    };

    window.closeEventModal = function() {
      document.getElementById('modalEvent').style.display = 'none';
    };

    window.submitEvent = function() {
      var title = document.getElementById('evTitle').value.trim();
      var startVal = document.getElementById('evStart').value;
      var endVal   = document.getElementById('evEnd').value;
      var desc     = document.getElementById('evDesc').value.trim();
      var loc      = document.getElementById('evLocation').value.trim();

      if (!title) {
        document.getElementById('evTitle').style.borderColor = 'var(--danger)';
        document.getElementById('evTitle').focus();
        return;
      }
      if (!startVal) {
        document.getElementById('evStart').style.borderColor = 'var(--danger)';
        return;
      }

      var start = new Date(startVal).toISOString().replace(/[-:.]/g,'').slice(0,15) + 'Z';
      var end   = endVal ? new Date(endVal).toISOString().replace(/[-:.]/g,'').slice(0,15) + 'Z' : start;

      var calUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text='  + encodeURIComponent(title)
        + '&dates=' + start + '%2F' + end
        + (desc ? '&details=' + encodeURIComponent(desc) : '')
        + (loc  ? '&location='+ encodeURIComponent(loc)  : '');

      window.open(calUrl, '_blank');
      window.closeEventModal();
    };

    window.refreshCalendar = function() {
      var iframe = document.querySelector('.cal-iframe');
      if (iframe) { iframe.src = iframe.src; }
    };

    document.getElementById('modalEvent').addEventListener('click', function(e) {
      if (e.target === this) window.closeEventModal();
    });
  });
</script>
</body>
</html>
