<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSPD — Calendrier</title>
  <link rel="stylesheet" href="style.css?v=15">
  <style>
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .cal-header { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
    .cal-day-name { text-align:center; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; padding:8px 0; opacity:.7; }
    .cal-cell {
      background:var(--surface2); border:1px solid var(--border); border-radius:5px;
      min-height:130px; padding:7px; cursor:pointer; transition:border-color .15s; position:relative;
    }
    .cal-cell:hover { border-color:var(--gold); }
    .cal-cell.today { border-color:var(--gold); background:rgba(201,168,76,.06); }
    .cal-cell.other-month { opacity:.35; }
    .cal-cell.selected { border-color:var(--gold); background:rgba(201,168,76,.1); }
    .cal-num { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:6px; }
    .cal-cell.today .cal-num { color:var(--gold); font-weight:700; }
    .cal-event {
      font-size:11px; padding:3px 7px; border-radius:3px; margin-bottom:3px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
      font-family:'Inter',sans-serif; font-weight:500;
    }
    .cal-event.type-patrouille { background:rgba(37,137,208,.2); color:#5bc4f5; border-left:2px solid #2589d0; }
    .cal-event.type-briefing   { background:rgba(201,168,76,.2); color:var(--gold-b); border-left:2px solid var(--gold); }
    .cal-event.type-formation  { background:rgba(26,158,86,.2);  color:#4ade80; border-left:2px solid var(--success); }
    .cal-event.type-operation  { background:rgba(184,48,48,.2);  color:#f87070; border-left:2px solid var(--danger); }
    .cal-event.type-autre          { background:rgba(61,88,120,.2);  color:var(--text2); border-left:2px solid var(--border2); }
    .cal-event.type-interrogatoire { background:rgba(125,60,152,.2);  color:#bf7df0; border-left:2px solid #7d3c98; }
    .cal-event.type-plainte        { background:rgba(180,83,9,.2);    color:var(--gold-b); border-left:2px solid var(--warning); }
    .cal-event.type-convocation    { background:rgba(184,48,48,.15);  color:#ff9090; border-left:2px solid #c05050; }
    .cal-nav { display:flex; align-items:center; gap:12px; }
    .cal-nav button { background:transparent; border:1px solid var(--border2); border-radius:4px; color:var(--text2); width:30px; height:30px; cursor:pointer; font-size:14px; transition:all .15s; }
    .cal-nav button:hover { border-color:var(--gold); color:var(--gold); }
    .cal-month-title { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:var(--text); letter-spacing:2px; min-width:160px; text-align:center; text-transform:uppercase; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text2); letter-spacing:1px; }
    .legend-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
  </style>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05080f">
</head>
<body>
<div class="app-shell">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="topbar">
  <div class="tb-left">
    <button class="tb-menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="tb-brand">
      <div class="tb-shield"></div>
      <img class="tb-logo" src="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png" alt="LSPD" onerror="this.style.display='none'">
      <div class="tb-title">L.S.P.D</div>
    </div>
    <div class="tb-page">Calendrier</div>
  </div>
  <div class="tb-right">
    <div class="tb-status"><div class="live-dot"></div>En ligne</div>
    <div class="tb-time" id="tbClock">--:--:--</div>
    <div class="tb-user">
      <span class="tb-grade" id="tbGrade">—</span>
      <span class="tb-name" id="tbName">Officier</span>
    </div>
    <button class="btn-out" onclick="logout()">Quitter</button>
  </div>
</div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">

    <div class="page-head" style="margin-bottom:12px">
      <div class="page-head-left">
        <h2>Calendrier</h2>
        <p>// Planning & événements — Los Santos Police Department</p>
      </div>
      <button id="btnNewEvent" onclick="openNewEvent()" style="padding:8px 16px;background:var(--gold);color:#0a0c12;border:none;border-radius:5px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer">
        + Ajouter un événement
      </button>
    </div>

    <!-- Navigation mois -->
    <div class="card" style="margin-bottom:10px">
      <div class="card-body" style="padding:12px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div class="cal-nav">
            <button onclick="prevMonth()">‹</button>
            <div class="cal-month-title" id="calMonthTitle">—</div>
            <button onclick="nextMonth()">›</button>
            <button onclick="goToday()" style="width:auto;padding:0 10px;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:1px">Aujourd'hui</button>
          </div>
          <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#2589d0"></div>Patrouille</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div>Briefing</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div>Formation</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>Opération</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--border2)"></div>Autre</div>
            <div class="legend-item"><div class="legend-dot" style="background:#7d3c98"></div>Interrogatoire</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--warning)"></div>Plainte</div>
            <div class="legend-item"><div class="legend-dot" style="background:#c05050"></div>Convocation</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Grille calendrier -->
    <div class="card">
      <div class="card-body" style="padding:12px">
        <div class="cal-header">
          <div class="cal-day-name">Lun</div>
          <div class="cal-day-name">Mar</div>
          <div class="cal-day-name">Mer</div>
          <div class="cal-day-name">Jeu</div>
          <div class="cal-day-name">Ven</div>
          <div class="cal-day-name">Sam</div>
          <div class="cal-day-name">Dim</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>

  </div>
</div>
</div>

<!-- MODAL ÉVÉNEMENT -->
<div id="modalEvent" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(2px)">
  <div style="background:var(--surface);border:1px solid var(--border2);border-radius:10px;width:100%;max-width:460px;position:relative;overflow:hidden">
    <div style="height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)"></div>
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span id="modalEventTitle" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase">📅 Nouvel événement</span>
      <button onclick="closeEventModal()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer">×</button>
    </div>
    <div style="padding:18px;display:flex;flex-direction:column;gap:12px">
      <div class="fg">
        <label>Titre *</label>
        <input id="evTitle" placeholder="ex: Patrouille nuit, Briefing équipe...">
      </div>
      <div class="fg">
        <label>Type</label>
        <select id="evType">
          <option value="patrouille">🚔 Patrouille</option>
          <option value="briefing">📋 Briefing</option>
          <option value="formation">🎓 Formation</option>
          <option value="operation">⚡ Opération</option>
          <option value="interrogatoire">🔍 Interrogatoire</option>
          <option value="plainte">📝 Dépôt de plainte</option>
          <option value="convocation">⚖️ Convocation à comparaître</option>
          <option value="autre">📌 Autre</option>
        </select>
      </div>
      <div class="fg">
        <label>Agent responsable</label>
        <input id="evAgent" placeholder="Nom de l'agent...">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fg">
          <label>Début *</label>
          <input type="datetime-local" id="evStart">
        </div>
        <div class="fg">
          <label>Fin</label>
          <input type="datetime-local" id="evEnd">
        </div>
      </div>
      <div class="fg">
        <label>Description</label>
        <textarea id="evDesc" placeholder="Détails, instructions..."></textarea>
      </div>
    </div>
    <div style="padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <button id="btnDeleteEvent" style="display:none;padding:7px 12px;background:rgba(184,48,48,.1);border:1px solid rgba(184,48,48,.3);border-radius:5px;color:var(--danger-l);font-family:'Inter',sans-serif;font-size:11px;cursor:pointer" onclick="deleteEvent()">🗑 Supprimer</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button onclick="closeEventModal()" style="padding:8px 14px;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-family:'Inter',sans-serif;font-size:12px;cursor:pointer">Annuler</button>
        <button onclick="saveEvent()" style="padding:8px 16px;background:var(--gold);color:#0a0c12;border:none;border-radius:5px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;cursor:pointer">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initPage, startClock, showToast } from './utils3.js';

  const FC = {
    apiKey:"AIzaSyA4GxYd32GNs5EDjjm2UI1a0d25YxigMVU",
    authDomain:"lspd-intranet-2aed9.firebaseapp.com",
    projectId:"lspd-intranet-2aed9",
    storageBucket:"lspd-intranet-2aed9.firebasestorage.app",
    messagingSenderId:"780922925382",
    appId:"1:780922925382:web:a32d5e89bcff75bd8b3547"
  };

  const app  = initializeApp(FC);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let currentYear, currentMonth, allEvents = [], editingId = null, userPerms = {};

  startClock('tbClock');

  initPage(auth, db, onAuthStateChanged, 'calendrier').then(function(data) {
    userPerms = data.perms;

    // Masquer bouton ajout si lecture seule
    if (!userPerms.canWrite) {
      document.getElementById('btnNewEvent').style.display = 'none';
    }

    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();

    loadEvents();
  });

  async function loadEvents() {
    try {
      const snap = await getDocs(collection(db, 'evenements'));
      allEvents = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      renderCalendar();
    } catch(e) { console.error(e); }
  }

  function renderCalendar() {
    const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    document.getElementById('calMonthTitle').textContent = MOIS[currentMonth] + ' ' + currentYear;

    const grid  = document.getElementById('calGrid');
    const today = new Date();
    const first = new Date(currentYear, currentMonth, 1);
    // Lundi = 0
    let startDay = first.getDay() - 1;
    if (startDay < 0) startDay = 6;

    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate();

    let html = '';
    let totalCells = Math.ceil((startDay + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
      let day, month, year, otherMonth = false;
      if (i < startDay) {
        day = daysInPrev - startDay + i + 1;
        month = currentMonth - 1;
        year  = currentYear;
        if (month < 0) { month = 11; year--; }
        otherMonth = true;
      } else if (i >= startDay + daysInMonth) {
        day = i - startDay - daysInMonth + 1;
        month = currentMonth + 1;
        year  = currentYear;
        if (month > 11) { month = 0; year++; }
        otherMonth = true;
      } else {
        day   = i - startDay + 1;
        month = currentMonth;
        year  = currentYear;
      }

      const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();

      // Événements de ce jour
      const dayEvents = allEvents.filter(function(e) {
        if (!e.start) return false;
        const d = new Date(e.start);
        return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
      });

      const evHtml = dayEvents.slice(0,3).map(function(e) {
        var agentStr = e.agent ? ' — ' + e.agent : ''; return '<div class="cal-event type-' + (e.type||'autre') + '" onclick="event.stopPropagation();openEditEvent(\'' + e.id + '\')" title="' + (e.title||'') + agentStr + '">' + (e.title||'') + '</div>';
      }).join('') + (dayEvents.length > 3 ? '<div style="font-size:9px;color:var(--text3);font-family:JetBrains Mono,monospace;padding:1px 4px">+' + (dayEvents.length-3) + ' autres</div>' : '');

      html += '<div class="cal-cell' + (isToday?' today':'') + (otherMonth?' other-month':'') + '" onclick="openNewEventOnDate(\'' + dateStr + '\')">'
        + '<div class="cal-num">' + day + '</div>'
        + evHtml
        + '</div>';
    }

    grid.innerHTML = html;
  }

  // ── Navigation ──────────────────────────────────────────
  window.prevMonth = function() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  };
  window.nextMonth = function() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  };
  window.goToday = function() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  };

  // ── Modal ────────────────────────────────────────────────
  window.openNewEvent = function() {
    editingId = null;
    document.getElementById('modalEventTitle').textContent = '📅 Nouvel événement';
    document.getElementById('btnDeleteEvent').style.display = 'none';
    document.getElementById('evTitle').value = '';
    document.getElementById('evAgent').value = document.getElementById('tbName')?.textContent || '';
    document.getElementById('evType').value  = 'patrouille';
    document.getElementById('evDesc').value  = '';
    const now = new Date(); now.setMinutes(0,0,0);
    const fmt = function(d) { return d.toISOString().slice(0,16); };
    document.getElementById('evStart').value = fmt(now);
    const end = new Date(now); end.setHours(end.getHours()+1);
    document.getElementById('evEnd').value = fmt(end);
    document.getElementById('modalEvent').style.display = 'flex';
    setTimeout(function(){ document.getElementById('evTitle').focus(); }, 80);
  };

  window.openNewEventOnDate = function(dateStr) {
    window.openNewEvent();
    document.getElementById('evAgent').value = document.getElementById('tbName')?.textContent || '';
    document.getElementById('evStart').value = dateStr + 'T08:00';
    document.getElementById('evEnd').value   = dateStr + 'T09:00';
  };

  window.openEditEvent = function(id) {
    const e = allEvents.find(function(x){ return x.id === id; });
    if (!e) return;
    editingId = id;
    document.getElementById('modalEventTitle').textContent = '✏️ Modifier l\'événement';
    document.getElementById('btnDeleteEvent').style.display = userPerms.canDelete ? 'block' : 'none';
    document.getElementById('evTitle').value = e.title || '';
    document.getElementById('evType').value  = e.type  || 'autre';
    document.getElementById('evAgent').value = e.agent || '';
    document.getElementById('evDesc').value  = e.description || '';
    document.getElementById('evStart').value = e.start ? e.start.slice(0,16) : '';
    document.getElementById('evEnd').value   = e.end   ? e.end.slice(0,16)   : '';
    document.getElementById('modalEvent').style.display = 'flex';
  };

  window.closeEventModal = function() {
    document.getElementById('modalEvent').style.display = 'none';
    editingId = null;
  };

  window.saveEvent = async function() {
    const title = document.getElementById('evTitle').value.trim();
    const start = document.getElementById('evStart').value;
    if (!title) { showToast('Le titre est obligatoire', 'error'); return; }
    if (!start) { showToast('La date de début est obligatoire', 'error'); return; }

    const payload = {
      title:       title,
      type:        document.getElementById('evType').value,
      start:       start,
      end:         document.getElementById('evEnd').value,
      description: document.getElementById('evDesc').value.trim(),
      agent:       document.getElementById('evAgent').value.trim(),
      createdBy:   document.getElementById('tbName')?.textContent || 'Officier',
      updatedAt:   new Date().toISOString()
    };

    try {
      if (editingId) {
        await updateDoc(doc(db, 'evenements', editingId), payload);
        showToast('Événement mis à jour ✓', 'success');
      } else {
        payload.createdAt = new Date().toISOString();
        await addDoc(collection(db, 'evenements'), payload);
        showToast('Événement ajouté ✓', 'success');
      }
      closeEventModal();
      await loadEvents();
    } catch(e) { showToast('Erreur : ' + e.message, 'error'); }
  };

  window.deleteEvent = async function() {
    if (!editingId || !confirm('Supprimer cet événement ?')) return;
    try {
      await deleteDoc(doc(db, 'evenements', editingId));
      showToast('Événement supprimé', 'success');
      closeEventModal();
      await loadEvents();
    } catch(e) { showToast('Erreur : ' + e.message, 'error'); }
  };

  document.getElementById('modalEvent').addEventListener('click', function(e) {
    if (e.target === this) window.closeEventModal();
  });
</script>
</body>
</html>
