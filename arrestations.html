<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSPD — Arrestations</title>
  <link rel="stylesheet" href="style.css">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LSPD">
  <meta name="theme-color" content="#1a5fb4">
  <link rel="apple-touch-icon" href="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png">
</head>
<body>
<div class="app-shell">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="topbar">
  <div class="tb-left">
    <button class="tb-menu-btn" onclick="toggleSidebar()">☰</button>
    <img class="tb-logo" src="https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png" alt="LSPD">
    <div class="tb-sep"></div>
    <div class="tb-title">L.S.P.D</div>
    <div class="tb-sep"></div>
    <div class="tb-page">ARRESTATIONS</div>
  </div>
  <div class="tb-right">
    <div class="tb-time" id="tbClock">--:--:--</div>
    <span class="tb-grade" id="tbGrade">—</span>
    <span class="tb-name" id="tbName">Officier</span>
    <button class="btn-out" onclick="logout()">Déconnexion</button>
  </div>
</div>

<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">

    <div class="page-head">
      <div class="page-head-left">
        <h2>ARRESTATIONS</h2>
        <p>// FICHES D'ARRESTATION — MISE EN GARDE À VUE — LIBÉRATIONS</p>
      </div>
      <button class="btn btn-primary" id="btnNew" style="display:none">+ Nouvelle arrestation</button>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-box blue"><div class="stat-lbl">TOTAL ARRESTATIONS</div><div class="stat-val" id="sTotal">—</div></div>
      <div class="stat-box red"><div class="stat-lbl">EN GARDE À VUE</div><div class="stat-val" id="sMGV">—</div></div>
      <div class="stat-box green"><div class="stat-lbl">LIBÉRÉS</div><div class="stat-val" id="sLiberes">—</div></div>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher par nom, motif, officier..." oninput="filterArrestations()">
      <select id="filterStatut" onchange="filterArrestations()">
        <option value="">Tous les statuts</option>
        <option value="En garde à vue">En garde à vue</option>
        <option value="Libéré">Libéré</option>
        <option value="Transféré">Transféré</option>
      </select>
    </div>

    <div class="card">
      <div class="card-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>RÉFÉRENCE</th>
                <th>SUSPECT</th>
                <th>MOTIF</th>
                <th>OFFICIER</th>
                <th>DATE</th>
                <th>STATUT</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="arrestationsTable">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px">CHARGEMENT...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
</div>

<!-- MODAL ARRESTATION -->
<div class="modal-bg" id="modalArrestation">
  <div class="modal" style="max-width:700px">
    <div class="modal-head">
      <div class="modal-title">FICHE D'ARRESTATION</div>
      <button class="modal-close" onclick="closeModal('modalArrestation')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid g2" style="margin-bottom:14px">
        <div class="fg"><label>Nom du suspect</label><input id="arNom" placeholder="Nom Prénom"></div>
        <div class="fg"><label>Date de naissance</label><input type="date" id="arDob"></div>
        <div class="fg">
          <label>Motif d'arrestation</label>
          <select id="arMotif">
            <option>Agression</option>
            <option>Vol / Cambriolage</option>
            <option>Trafic de drogue</option>
            <option>Port illégal d'arme</option>
            <option>Meurtre / Tentative</option>
            <option>Évasion</option>
            <option>Résistance à agent</option>
            <option>Conduite en état d'ivresse</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="fg"><label>Lieu d'arrestation</label><input id="arLieu" placeholder="ex: Grove Street"></div>
        <div class="fg"><label>Officier arrêtant</label><input id="arOfficier"></div>
        <div class="fg"><label>Date & heure</label><input type="datetime-local" id="arDate"></div>
        <div class="fg">
          <label>Statut</label>
          <select id="arStatut">
            <option>En garde à vue</option>
            <option>Libéré</option>
            <option>Transféré</option>
          </select>
        </div>
        <div class="fg"><label>Durée MGV (heures)</label><input type="number" id="arDuree" placeholder="ex: 24" min="1"></div>
      </div>
      <div class="fg" style="margin-bottom:14px">
        <label>Objets saisis</label>
        <input id="arObjets" placeholder="ex: 1 pistolet, 50g de drogue...">
      </div>
      <div class="fg">
        <label>Compte-rendu de l'arrestation</label>
        <textarea id="arDesc" style="min-height:100px" placeholder="Déroulement de l'arrestation..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modalArrestation')">Annuler</button>
      <button class="btn btn-primary" onclick="saveArrestation()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initPage, startClock, showToast, openModal, closeModal, setupModalClose, statusBadge, addLog, generateRef, getPerms, captureModal, formatDateTime } from './utils.js';
  import { printArrestation } from './pdf-templates.js';

  const firebaseConfig = {
    apiKey: "AIzaSyA4GxYd32GNs5EDjjm2UI1a0d25YxigMVU",
    authDomain: "lspd-intranet-2aed9.firebaseapp.com",
    projectId: "lspd-intranet-2aed9",
    storageBucket: "lspd-intranet-2aed9.firebasestorage.app",
    messagingSenderId: "780922925382",
    appId: "1:780922925382:web:a32d5e89bcff75bd8b3547"
  };

  const DISCORD_GAV = 'https://discordapp.com/api/webhooks/1483586726206374028/ZP0_6vej_0vKMYAPOnzSMtkKO1R9oku-T4pjaTmFvcy216Ls7jKfslqtsrLGl70Wj7fo';

  async function sendDiscordGAV(a) {
    try {
      await fetch(DISCORD_GAV, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          embeds: [{
            title: '📂 | GARDE À VUE',
            color: 0xC9AA4D,
            fields: [
              { name: '👤 Nom du détenu',          value: `**${a.nom||'—'}**`,    inline: true },
              { name: '📄 Motif de la GAV',         value: a.motif||'—',           inline: false },
              { name: '🕒 Heure d\'entrée',         value: a.date ? new Date(a.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—', inline: true },
              { name: '⏳ Durée de GAV',            value: a.duree ? `${a.duree}h` : '—', inline: true },
              { name: '👮 Agent en charge',         value: a.officier||'—',        inline: true },
              { name: '📌 Statut',                  value: '🟡 En cours',          inline: true },
            ],
            footer: { text: 'LSPD Intranet — Garde à Vue' },
            timestamp: new Date().toISOString()
          }]
        })
      });
    } catch(e) { console.warn('Discord GAV failed:', e); }
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allArrestations = [];
  let userGrade = 'cadet';
  let officierName = '';

  startClock('tbClock');
  setupModalClose();

  // Expose globaux
  window.closeModal = closeModal;
  window.captureModal = captureModal;

  initPage(auth, db, onAuthStateChanged, 'arrestations').then(async ({ grade, name, perms }) => {
    userGrade = grade;
    officierName = name;

    if (perms.canWrite) {
      const btnNew = document.getElementById('btnNew');
      btnNew.style.display = '';
      btnNew.addEventListener('click', () => {
        document.getElementById('arOfficier').value = name;
        document.getElementById('arDate').value = new Date().toISOString().slice(0, 16);
        // Reset fields
        ['arNom','arDob','arLieu','arDuree','arObjets','arDesc'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
        openModal('modalArrestation');
      });
    }

    await loadArrestations();
  });

  async function loadArrestations() {
    try {
      const snap = await getDocs(query(collection(db, 'arrestations'), orderBy('createdAt', 'desc')));
      allArrestations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('sTotal').textContent   = allArrestations.length;
      document.getElementById('sMGV').textContent     = allArrestations.filter(a => a.statut === 'En garde à vue').length;
      document.getElementById('sLiberes').textContent = allArrestations.filter(a => a.statut === 'Libéré').length;
      renderArrestations(allArrestations);
    } catch(e) { console.error('Load error:', e); showToast('Erreur de chargement', 'error'); }
  }

  function renderArrestations(list) {
    const tb = document.getElementById('arrestationsTable');
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="7"><div class="empty-state"><span class="ei">🚔</span><p>AUCUNE ARRESTATION ENREGISTRÉE</p></div></td></tr>';
      return;
    }
    tb.innerHTML = list.map(a => `
      <tr>
        <td style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">${a.reference||'—'}</td>
        <td><strong>${a.nom||'—'}</strong></td>
        <td style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.motif||'—'}</td>
        <td style="font-size:12px;color:var(--text2)">${a.officier||'—'}</td>
        <td style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)">${a.date ? new Date(a.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
        <td>${statusBadge(a.statut)}</td>
        <td>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="doPrintMGV('${a.id}')" title="Mise en garde à vue">📋 MGV</button>
            <button class="btn btn-ghost btn-sm" onclick="doPrintPDF('${a.id}')" title="PDF arrestation">📄 PDF</button>
            <button class="btn btn-ghost btn-sm" onclick="doPrintLib('${a.id}')" title="Bon de libération">🔓 Libération</button>
            ${userGrade !== 'cadet' ? `<button class="btn btn-danger btn-sm" onclick="deleteArrestation('${a.id}')">🗑️</button>` : ''}
          </div>
        </td>
      </tr>
    `).join('');
  }

  window.filterArrestations = function() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const s = document.getElementById('filterStatut').value;
    renderArrestations(allArrestations.filter(a =>
      ((a.nom||'') + ' ' + (a.motif||'') + ' ' + (a.officier||'')).toLowerCase().includes(q) &&
      (!s || a.statut === s)
    ));
  };

  window.saveArrestation = async function() {
    const payload = {
      reference:   generateRef('ARR'),
      nom:         document.getElementById('arNom').value.trim(),
      dob:         document.getElementById('arDob').value,
      motif:       document.getElementById('arMotif').value,
      lieu:        document.getElementById('arLieu').value,
      officier:    document.getElementById('arOfficier').value,
      date:        document.getElementById('arDate').value,
      statut:      document.getElementById('arStatut').value,
      duree:       document.getElementById('arDuree').value,
      objets:      document.getElementById('arObjets').value,
      description: document.getElementById('arDesc').value,
      createdAt:   new Date().toISOString()
    };

    if (!payload.nom) { showToast('Le nom du suspect est obligatoire', 'error'); return; }

    try {
      await addDoc(collection(db, 'arrestations'), payload);
      await addLog(db, 'Arrestation', `${payload.nom} — ${payload.motif}`);

      if (payload.statut === 'En garde à vue') {
        await sendDiscordGAV(payload);
      }

      closeModal('modalArrestation');
      await loadArrestations();
      showToast('Arrestation enregistrée' + (payload.statut === 'En garde à vue' ? ' — Discord notifié 🔒' : ''), 'success');
    } catch(e) { showToast('Erreur: ' + e.message, 'error'); }
  };

  window.deleteArrestation = async function(id) {
    if (!confirm('Supprimer cette arrestation définitivement ?')) return;
    try {
      await deleteDoc(doc(db, 'arrestations', id));
      await loadArrestations();
      showToast('Arrestation supprimée', 'success');
    } catch(e) { showToast('Erreur suppression', 'error'); }
  };

  // ---- IMPRESSIONS ----
  // BUG FIX: Utilise l'objet réel, pas un string littéral
  window.doPrintMGV = function(id) {
    const a = allArrestations.find(x => x.id === id);
    if (!a) { showToast('Arrestation introuvable', 'error'); return; }
    printArrestation(a, 'LSPD', 'https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png');
  };

  window.doPrintPDF = function(id) {
    const a = allArrestations.find(x => x.id === id);
    if (!a) { showToast('Arrestation introuvable', 'error'); return; }
    printArrestation(a, 'LSPD', 'https://r2.fivemanage.com/XEcvh0aBGRYhLzNNcRsQI/lspdnouveau.png');
  };

  window.doPrintLib = function(id) {
    const a = allArrestations.find(x => x.id === id);
    if (!a) { showToast('Arrestation introuvable', 'error'); return; }
    printLiberation(a);
  };

  function printLiberation(a) {
    const w = window.open('', '_blank');
    if (!w) { showToast('Popup bloquée — autorisez les popups', 'error'); return; }
    const ref = a.reference || 'ARR-?';
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Bon de libération</title>
    <style>
      body{font-family:Arial,sans-serif;padding:40px;max-width:700px;margin:0 auto;color:#000}
      .header{border-bottom:3px solid #003087;padding-bottom:16px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
      h1{font-size:18px;color:#003087;margin:0} .sub{font-size:11px;color:#666;margin-top:4px}
      .ref{font-family:monospace;font-size:14px;font-weight:bold;color:#003087;background:#e8f0fe;padding:5px 12px;border-radius:4px}
      h2{font-size:11px;font-weight:bold;text-transform:uppercase;color:#003087;border-bottom:1px solid #003087;padding-bottom:4px;margin:20px 0 10px;letter-spacing:2px}
      .row{display:flex;margin-bottom:7px} .lbl{font-weight:bold;min-width:200px;font-size:13px} .val{font-size:13px}
      .sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
      .sig-box{border-top:1px solid #000;padding-top:8px;font-size:12px;text-align:center} .sig-space{height:60px}
      @media print{body{padding:0}}
    </style></head><body>
    <div class="header">
      <div><h1>L.S.P.D — BON DE LIBÉRATION</h1><div class="sub">Los Santos Police Department</div></div>
      <div class="ref">${ref}</div>
    </div>
    <h2>Identité du détenu</h2>
    <div class="row"><span class="lbl">Nom complet :</span><span class="val"><strong>${a.nom||'—'}</strong></span></div>
    <div class="row"><span class="lbl">Date de naissance :</span><span class="val">${a.dob||'—'}</span></div>
    <h2>Détails de la garde à vue</h2>
    <div class="row"><span class="lbl">Motif d'arrestation :</span><span class="val">${a.motif||'—'}</span></div>
    <div class="row"><span class="lbl">Officier arrêtant :</span><span class="val">${a.officier||'—'}</span></div>
    <div class="row"><span class="lbl">Date d'arrestation :</span><span class="val">${a.date ? new Date(a.date).toLocaleString('fr-FR') : '—'}</span></div>
    <div class="row"><span class="lbl">Durée de garde à vue :</span><span class="val">${a.duree||'—'} heure(s)</span></div>
    <h2>Libération</h2>
    <div class="row"><span class="lbl">Date de libération :</span><span class="val">${new Date().toLocaleString('fr-FR')}</span></div>
    <div class="row"><span class="lbl">Statut :</span><span class="val"><strong>LIBÉRÉ(E)</strong></span></div>
    <div class="sig-grid">
      <div class="sig-box"><div class="sig-space"></div>Officier responsable</div>
      <div class="sig-box"><div class="sig-space"></div>Superviseur</div>
    </div>
    </body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 500);
  }
</script>
</body>
</html>
